name: Create RDS Users

on: 
  workflow_dispatch:
env:
  AWS_REGION : us-east-1 

permissions:
  id-token: write   
  contents: read    

jobs:
  deploy-lambdas:
      runs-on: ubuntu-latest
      steps:
        - name: Git clone the repository
          uses: actions/checkout@v3
        - name: configure aws credentials
          uses: aws-actions/configure-aws-credentials@v1.7.0
          with:
            role-to-assume: arn:aws:iam::111111111111:role/terraform-bootstrap-role
            role-session-name: GitHub_to_AWS_via_FederatedOIDC
            aws-region: ${{ env.AWS_REGION }}
        - name: Run setup_rds_users lambda
          run: | 
            set -e
            aws lambda invoke \
              --function-name generate_nft \
              --cli-binary-format raw-in-base64-out \
              --log-type Tail \
              --payload '{}' \
              /tmp/response.json > /tmp/invoke.log
            
            # Show logs
            jq -r .LogResult /tmp/response.json | base64 -d
          
            # Exit if Lambda errored
            jq -e '.FunctionError == null' /tmp/response.json > /dev/null || exit 1
